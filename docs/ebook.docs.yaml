openapi: 3.0.0
info:
  title: Ebooks API
  description: API para gerenciamento de eBooks
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

tags:
  - name: Ebooks
    description: Operações relacionadas a ebooks

paths:
  /books:
    post:
      summary: Criar um novo ebook
      description: |
        Cria um novo registro de ebook e armazena os ficheiros de capa e PDF.
        O livro é criado com `statePublisher: pendent` e precisa ser aprovado por um admin
        em `PATCH /books/{ebookId}/confirm`.

        **Ficheiros (multipart/form-data)** — apenas estes nomes de campo são aceites:
        - `cover`: imagem de capa (PNG, JPG, WEBP, GIF, BMP, SVG, TIFF), obrigatório, até 5 ficheiros
        - `file`: ficheiro PDF, 1 ficheiro, obrigatório quando `format` é `pdf`

        Qualquer outro nome de campo de ficheiro, ou quantidade acima do limite, devolve 400.
      operationId: createEbook
      tags:
        - Ebooks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              cover:
                contentType: image/png, image/jpeg, image/jpg, image/webp, image/gif, image/bmp, image/svg+xml, image/tiff
              file:
                contentType: application/pdf
            schema:
              type: object
              required:
                - title
                - code
                - sinopse
                - description
                - author
                - categoryId
                - format
                - language
                - price
                - pages
                - cover
              properties:
                title:
                  type: string
                  description: Título do ebook
                  example: "Aprendendo TypeScript"
                code:
                  type: string
                  description: Código único do ebook
                  example: "TS-001"
                description:
                  type: string
                  description: Descrição do ebook
                  example: "Um guia completo para programadores que querem dominar TypeScript."
                sinopse:
                  type: string
                  description: Sinopse do ebook
                  example: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                author:
                  type: string
                  description: Autor do ebook
                  example: "João da Silva"
                categoryId:
                  type: string
                  description: ID da categoria ao qual o ebook pertence
                  example: "123e4567-e89b-12d3-a456-426614174000"
                format:
                  type: string
                  enum:
                    - pdf
                    - physical
                  description: Formato do ebook. Se `pdf`, o campo `file` é obrigatório.
                  example: "pdf"
                type:
                  type: string
                  enum:
                    - new
                    - used
                  description: Estado do livro (opcional)
                  example: "new"
                language:
                  type: string
                  description: Idioma do ebook
                  example: "Português"
                price:
                  type: number
                  minimum: 1
                  description: Preço do ebook
                  example: 29.9
                pages:
                  type: integer
                  minimum: 1
                  description: Quantidade de páginas do ebook
                  example: 250
                quantity:
                  type: integer
                  description: Quantidade em stock (para livros físicos)
                  example: 10
                cover:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
                  description: Imagens de capa (campo `cover`, até 5)
                file:
                  type: string
                  format: binary
                  description: Ficheiro PDF do ebook (campo `file`, 1 ficheiro)
      responses:
        "201":
          description: Ebook criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  ebook:
                    $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                message: "Book criado com sucesso!"
                ebook:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  code: "TS-001"
                  title: "Aprendendo TypeScript"
                  author: "João da Silva"
                  language: "Português"
                  sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                  description: "Um guia completo para programadores que querem dominar TypeScript."
                  price: 29.9
                  categoryId: "123e4567-e89b-12d3-a456-426614174000"
                  format: "pdf"
                  pages: 250
                  publishDate: null
                  statePublisher: "pendent"
        "400":
          description: Dados inválidos, ficheiros em falta ou erro de upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validacao:
                  summary: Erro de validação dos campos
                  value:
                    success: false
                    message: "Verifique os dados preenchidos."
                    errors:
                      - field: "title"
                        message: "Este campo é obrigatório."
                campoInvalido:
                  summary: Nome de campo de ficheiro inválido ou limite excedido
                  value:
                    success: false
                    message: "Campo de ficheiro inválido ou excedido: 'pdf'. Use 'cover' (até 5 imagens) e 'file' (1 PDF)."
                tipoInvalido:
                  summary: Tipo de ficheiro inválido
                  value:
                    success: false
                    message: "O campo 'file' aceita apenas ficheiros PDF."
                capaEmFalta:
                  summary: Capa não enviada
                  value:
                    success: false
                    message: "Capa do livro nao enviada!"
                pdfEmFalta:
                  summary: PDF não enviado para formato pdf
                  value:
                    success: false
                    message: "Nenhum ficheiro foi enviado!"
        "401":
          description: Token não fornecido ou usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Token inválido ou usuário não autorizado a criar livros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Não autorizado a criar Books"
        "409":
          description: Já existe um livro com o código informado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "O livro já existe, tente outro código!"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Listar todos os ebooks
      description: Retorna uma lista com todos os ebooks cadastrados
      operationId: getAllEbooks
      tags:
        - Ebooks
      responses:
        "200":
          description: Lista de ebooks recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ebooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                ebooks:
                  - id: "123e4567-e89b-12d3-a456-426614174000"
                    code: "TS-001"
                    title: "Aprendendo TypeScript"
                    author: "João da Silva"
                    language: "Português"
                    sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                    description: "Um guia completo para programadores que querem dominar TypeScript."
                    price: 29.9
                    categoryId: "123e4567-e89b-12d3-a456-426614174000"
                    format: "PDF"
                    pages: 250
                    publishDate: "2026-08-04T12:00:00.000Z"
                    statePublisher: "published"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/category/{categoryId}:
    get:
      summary: Buscar ebooks por categoria
      description: Retorna todos os ebooks associados a uma categoria específica
      operationId: getEbooksByCategory
      tags:
        - Ebooks
      parameters:
        - name: categoryId
          in: path
          required: true
          description: ID da categoria
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Ebooks recuperados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ebooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                ebooks:
                  - id: "123e4567-e89b-12d3-a456-426614174000"
                    code: "TS-001"
                    title: "Aprendendo TypeScript"
                    author: "João da Silva"
                    language: "Português"
                    sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                    description: "Um guia completo para programadores que querem dominar TypeScript."
                    price: 29.9
                    categoryId: "123e4567-e89b-12d3-a456-426614174000"
                    format: "PDF"
                    pages: 250
                    publishDate: "2026-08-04T12:00:00.000Z"
                    statePublisher: "published"
        "404":
          description: Nenhum ebook encontrado para a categoria informada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/seller:
    get:
      summary: Buscar ebooks do vendedor autenticado
      description: Retorna todos os ebooks do vendedor identificado pelo token JWT.
      operationId: getEbooksBySeller
      tags:
        - Ebooks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ebooks recuperados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ebooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                ebooks:
                  - id: "123e4567-e89b-12d3-a456-426614174000"
                    code: "TS-001"
                    title: "Aprendendo TypeScript"
                    author: "João da Silva"
                    language: "Português"
                    sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                    description: "Um guia completo para programadores que querem dominar TypeScript."
                    price: 29.9
                    categoryId: "123e4567-e89b-12d3-a456-426614174000"
                    format: "PDF"
                    pages: 250
                    publishDate: "2026-08-04T12:00:00.000Z"
                    statePublisher: "published"
        "401":
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Nenhum ebook encontrado para o vendedor autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{ebookId}:
    get:
      summary: Buscar ebook por ID
      description: Retorna os dados de um ebook específico
      operationId: getEbookById
      tags:
        - Ebooks
      parameters:
        - name: ebookId
          in: path
          required: true
          description: ID do ebook
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Ebook recuperado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  ebook:
                    $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                ebook:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  code: "TS-001"
                  title: "Aprendendo TypeScript"
                  author: "João da Silva"
                  language: "Português"
                  sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                  description: "Um guia completo para programadores que querem dominar TypeScript."
                  price: 29.9
                  categoryId: "123e4567-e89b-12d3-a456-426614174000"
                  format: "PDF"
                  pages: 250
                  publishDate: "2026-08-04T12:00:00.000Z"
                  statePublisher: "published"
        "404":
          description: Ebook não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Atualizar ebook
      description: Atualiza os dados de um ebook existente
      operationId: updateEbook
      tags:
        - Ebooks
      security:
        - bearerAuth: []
      parameters:
        - name: ebookId
          in: path
          required: true
          description: ID do ebook a ser atualizado
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                code:
                  type: string
                description:
                  type: string
                sinopse:
                  type: string
                author:
                  type: string
                categoryId:
                  type: string
                format:
                  type: string
                language:
                  type: string
                price:
                  type: number
                pages:
                  type: integer
            example:
              title: "Aprendendo TypeScript - Edição Atualizada"
              price: 34.9
      responses:
        "200":
          description: Ebook atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  ebook:
                    $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                message: "Dados do Book actualizados com sucesso!"
                ebook:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  code: "TS-001"
                  title: "Aprendendo TypeScript - Edição Atualizada"
                  author: "João da Silva"
                  language: "Português"
                  sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                  description: "Um guia completo para programadores que querem dominar TypeScript."
                  price: 34.9
                  categoryId: "123e4567-e89b-12d3-a456-426614174000"
                  format: "PDF"
                  pages: 250
                  publishDate: "2026-08-04T12:00:00.000Z"
                  statePublisher: "published"
        "400":
          description: Dados inválidos fornecidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ebook não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Deletar ebook
      description: Remove um ebook do sistema
      operationId: deleteEbook
      tags:
        - Ebooks
      security:
        - bearerAuth: []
      parameters:
        - name: ebookId
          in: path
          required: true
          description: ID do ebook a ser deletado
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Ebook deletado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  ebook:
                    $ref: "#/components/schemas/EbookResponse"
              example:
                success: true
                message: "Book deletado com sucesso!"
                ebook:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  code: "TS-001"
                  title: "Aprendendo TypeScript"
                  author: "João da Silva"
                  language: "Português"
                  sinopse: "Conceitos fundamentais e avançados de TypeScript para aplicações modernas."
                  description: "Um guia completo para programadores que querem dominar TypeScript."
                  price: 29.9
                  categoryId: "123e4567-e89b-12d3-a456-426614174000"
                  format: "PDF"
                  pages: 250
                  publishDate: "2026-08-04T12:00:00.000Z"
                  statePublisher: "published"
        "401":
          description: Token não fornecido ou inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Acesso negado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ebook não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /books/{ebookId}/confirm:
    patch:
      summary: Publicar ou rejeitar ebook (admin)
      description: |
        Permite ao administrador aprovar (`published`) ou rejeitar (`rejected`) um ebook pendente.
        Ao publicar, o campo `publishDate` é preenchido com a data atual.
        Requer token JWT com `userType` igual a `admin`.
      operationId: confirmEbook
      tags:
        - Ebooks
      security:
        - bearerAuth: []
      parameters:
        - name: ebookId
          in: path
          required: true
          description: ID do ebook
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - published
                    - rejected
                  description: Novo status do ebook
            examples:
              publicar:
                summary: Publicar ebook
                value:
                  status: "published"
              rejeitar:
                summary: Rejeitar ebook
                value:
                  status: "rejected"
      responses:
        "200":
          description: Status do ebook alterado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  ebook:
                    $ref: "#/components/schemas/EbookResponse"
              examples:
                publicado:
                  summary: Ebook publicado
                  value:
                    success: true
                    message: "Book publicado com sucesso!"
                    ebook:
                      id: "123e4567-e89b-12d3-a456-426614174000"
                      code: "TS-001"
                      title: "Aprendendo TypeScript"
                      author: "João da Silva"
                      language: "Português"
                      price: 29.9
                      categoryId: "123e4567-e89b-12d3-a456-426614174000"
                      format: "pdf"
                      publishDate: "2026-09-28T12:00:00.000Z"
                      statePublisher: "published"
                rejeitado:
                  summary: Ebook rejeitado
                  value:
                    success: true
                    message: "Book rejeitado com sucesso!"
                    ebook:
                      id: "123e4567-e89b-12d3-a456-426614174000"
                      code: "TS-001"
                      title: "Aprendendo TypeScript"
                      author: "João da Silva"
                      language: "Português"
                      price: 29.9
                      categoryId: "123e4567-e89b-12d3-a456-426614174000"
                      format: "pdf"
                      publishDate: null
                      statePublisher: "rejected"
        "400":
          description: Status inválido ou ebook já está com o status informado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                statusInvalido:
                  value:
                    success: false
                    message: "Status invalido! Use published ou rejected."
                mesmoStatus:
                  value:
                    success: false
                    message: "Livro ja esta com status published!"
        "401":
          description: Token não fornecido ou usuário não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuário não é administrador ou token inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Usuário nao autorizado a confirmar Books"
        "404":
          description: Ebook não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Livro nao encontrado!"
        "500":
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    EbookResponse:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        author:
          type: string
        language:
          type: string
        sinopse:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        price:
          type: number
        categoryId:
          type: string
        format:
          type: string
        pages:
          type: integer
          nullable: true
        publishDate:
          type: string
          format: date-time
          nullable: true
        statePublisher:
          type: string
          enum:
            - pendent
            - published
            - rejected
            - blocked
          nullable: true
        userId:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          nullable: true
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
