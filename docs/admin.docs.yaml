tags:
  - name: Admin
    description: Operacoes administrativas

paths:
  /admin/orders:
    get:
      summary: Listar todos os pedidos para administracao
      description: Retorna todos os pedidos com seus itens. Disponivel apenas para usuarios administradores.
      operationId: getAdminOrders
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos encontrados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderListResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Usuario nao autorizado como administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "500":
          description: Erro interno ao listar os pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"

  /admin/order/{orderId}:
    get:
      summary: Buscar pedido por ID para administracao
      description: Retorna um pedido com seus itens. Disponivel apenas para usuarios administradores.
      operationId: getAdminOrderById
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID do pedido
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pedido encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Usuario nao autorizado como administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "404":
          description: Pedido nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "500":
          description: Erro interno ao buscar o pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"

  /admin/client-confirmations:
    get:
      summary: Listar confirmações de recebimento do cliente
      description: Retorna todas as confirmações registradas para itens recebidos ou não recebidos pelos clientes.
      operationId: getAllClientConfirmations
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Confirmações retornadas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClientConfirmationsResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Usuario nao autorizado como administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "500":
          description: Erro interno ao buscar confirmações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"

  /admin/withdrawal/{withdrawalId}:
    put:
      summary: Atualizar status de um pedido de saque
      operationId: updateAdminWithdrawalStatus
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          description: ID do pedido de saque
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWithdrawalStatusRequest"
            example:
              withdrawalId: "123e4567-e89b-12d3-a456-426614174000"
              status: approved
              reason: "Pedido aprovado"
      responses:
        "200":
          description: Status do pedido alterado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalResponse"
        "401":
          description: Usuario nao autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "403":
          description: Usuario nao autorizado como administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"
        "500":
          description: Erro interno ao alterar o pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AdminOrderListResponse:
      type: object
      required:
        - success
        - orders
      properties:
        success:
          type: boolean
          example: true
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderWithItems"

    AdminOrderResponse:
      type: object
      required:
        - success
        - orders
      properties:
        success:
          type: boolean
          example: true
        orders:
          $ref: "#/components/schemas/OrderWithItems"

    AdminClientConfirmationsResponse:
      type: object
      required:
        - success
        - confirmations
      properties:
        success:
          type: boolean
          example: true
        confirmations:
          type: array
          items:
            $ref: "#/components/schemas/AdminClientConfirmation"

    AdminClientConfirmation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        orderId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        bookId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        quantity:
          type: integer
          example: 1
        userId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174003"
        status:
          type: string
          enum:
            - pending
            - received
            - notReceived
            - cancelled
          example: received
        receivedAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
          example: "Livro chegou em perfeito estado"
        proofUrl:
          type: string
          nullable: true
          example: "https://storage.example.com/proof/123.jpg"
        order:
          $ref: "#/components/schemas/AdminConfirmationOrder"

    AdminConfirmationOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        totalAmount:
          type: number
          format: double
          example: 99.9
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/AdminConfirmationOrderItem"

    AdminConfirmationOrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174004"
        orderId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174001"
        bookId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174002"
        quantity:
          type: integer
          example: 1
        price:
          type: number
          format: double
          example: 99.9
        book:
          $ref: "#/components/schemas/ClientBookSummary"

    AdminWithdrawalStatusRequest:
      type: object
      required:
        - withdrawalId
        - status
      properties:
        withdrawalId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - approved
            - blocked
            - cancelled
            - rejected
          example: approved
        reason:
          type: string
          example: "Pedido aprovado"

    AdminWithdrawalResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Status do pedido alterado com sucesso!"
        earnings:
          type: object
          additionalProperties: true

    AdminErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
