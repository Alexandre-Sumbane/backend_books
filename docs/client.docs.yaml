tags:
  - name: Client
    description: Operações relacionadas ao cliente

paths:
  /client/orders:
    get:
      tags:
        - Client
      summary: Lista os pedidos do cliente autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos listados com sucesso
        "401":
          description: Usuário não autenticado
        "500":
          description: Erro interno do servidor

  /client/order/{orderId}:
    patch:
      tags:
        - Client
      summary: Altera o status de um pedido
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: Identificador do pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  description: Novo status do pedido
                  example: completed
      responses:
        "200":
          description: Status do pedido alterado com sucesso
        "400":
          description: Dados inválidos
        "401":
          description: Usuário não autenticado
        "404":
          description: Pedido não encontrado
        "500":
          description: Erro interno do servidor