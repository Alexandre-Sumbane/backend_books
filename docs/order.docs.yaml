openapi: 3.0.0
info:
  title: Orders API
  description: API para criacao e consulta de pedidos
  version: 1.0.0

tags:
  - name: Orders
    description: Operacoes relacionadas aos pedidos

paths:
  /orders:
    post:
      summary: Criar um pedido
      description: Cria um pedido a partir de um carrinho pertencente ao usuario autenticado. O local de entrega e opcional.
      operationId: createOrder
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              cartId: "123e4567-e89b-12d3-a456-426614174000"
              delivery:
                clientName: "Maria Silva"
                phoneNumber: "841234567"
                locationId: "123e4567-e89b-12d3-a456-426614174001"
      responses:
        "200":
          description: Pedido criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "401":
          description: Usuario nao autenticado ou token ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Usuario nao autenticado"
        "403":
          description: Token de autenticacao invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Token invalido"
        "404":
          description: Carrinho ou local nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              examples:
                cartNotFound:
                  value:
                    success: false
                    message: "Carrinho nao encontrado"
                locationNotFound:
                  value:
                    success: false
                    message: "Local nao encontrado"
        "500":
          description: Erro interno ao criar o pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Ocorreu erro ao adicionar itens ao criar order, tente novamente"

    get:
      summary: Listar todos os pedidos
      description: Retorna todos os pedidos, incluindo os itens de cada pedido. Disponivel apenas para usuarios administradores.
      operationId: getAllOrders
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos encontrados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          description: Usuario nao autenticado ou token ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Usuario nao autenticado"
        "403":
          description: Usuario sem permissao de administrador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Usuario nao autorizado a listar todos os pedidos"
        "404":
          description: Nenhum pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Nenhuma pedido foi encontrado!"
        "500":
          description: Erro interno ao listar os pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Ocorreu erro ao buscar pedidos, tente novamente"

  /orders/user:
    get:
      summary: Listar pedidos do usuario autenticado
      description: Retorna os pedidos do usuario presente no token, incluindo os itens de cada pedido.
      operationId: getUserOrders
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos do usuario encontrados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          description: Usuario nao autenticado ou token ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Usuario nao autenticado"
        "403":
          description: Token de autenticacao invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Token invalido"
        "404":
          description: Nenhum pedido encontrado para o usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Nenhuma pedido foi encontrado!"
        "500":
          description: Erro interno ao buscar os pedidos do usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
              example:
                success: false
                message: "Ocorreu erro ao buscar pedidos do usuario, tente novamente"

  /orders/{orderId}:
    get:
      summary: Buscar pedido por ID
      description: Retorna um pedido do usuario autenticado, incluindo seus itens e os dados basicos de cada ebook.
      operationId: getOrderById
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: ID do pedido
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pedido encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Usuario nao autenticado ou token ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
        "403":
          description: Token de autenticacao invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
        "404":
          description: Pedido nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"
        "500":
          description: Erro interno ao buscar o pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateOrderRequest:
      type: object
      required:
        - cartId
      properties:
        cartId:
          type: string
          format: uuid
          description: ID do carrinho que sera convertido em pedido
          example: "123e4567-e89b-12d3-a456-426614174000"
        delivery:
          type: object
          description: Dados opcionais da entrega.
          required:
            - clientName
            - phoneNumber
          properties:
            clientName:
              type: string
              example: "Maria Silva"
            phoneNumber:
              type: string
              example: "841234567"
            locationId:
              type: string
              format: uuid
              description: ID do local de entrega. Quando omitido, nao ha custo de entrega.
              example: "123e4567-e89b-12d3-a456-426614174001"

    CreateOrderResponse:
      type: object
      required:
        - success
        - message
        - order
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Itens adicionados ao carrinho com sucesso!"
        order:
          $ref: "#/components/schemas/Order"

    OrderListResponse:
      type: object
      required:
        - success
        - orders
      properties:
        success:
          type: boolean
          example: true
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderWithItems"
          example:
            - id: "123e4567-e89b-12d3-a456-426614174002"
              orderNumber: "EBook-Order-2026-7-14-12-30-0"
              totalAmount: 84.9
              status: "pending"
              shippingAddress: "Campus UNITEC"
              userId: "123e4567-e89b-12d3-a456-426614174003"
              cartId: "123e4567-e89b-12d3-a456-426614174000"
              createdAt: "2026-08-15T12:30:00.000Z"
              updatedAt: "2026-08-15T12:30:00.000Z"

              orderItems:
                - id: "123e4567-e89b-12d3-a456-426614174004"
                  orderId: "123e4567-e89b-12d3-a456-426614174002"
                  bookId: "123e4567-e89b-12d3-a456-426614174005"
                  quantity: 2
                  createdAt: "2026-08-15T12:30:00.000Z"
                  updatedAt: "2026-08-15T12:30:00.000Z"

    OrderResponse:
      type: object
      required:
        - success
        - order
      properties:
        success:
          type: boolean
          example: true
        order:
          $ref: "#/components/schemas/OrderWithItems"

    Order:
      type: object
      required:
        - id
        - orderNumber
        - totalAmount
        - status
        - userId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          description: Numero unico gerado para o pedido
          example: "EBook-Order-2026-7-14-12-30-0"
        totalAmount:
          type: number
          format: double
          description: Total do carrinho somado ao custo de entrega, quando houver
          example: 84.9
        status:
          type: string
          enum: [pending, processing, shipped, delivered, completed, cancelled]
          example: pending
        shippingAddress:
          type: string
          nullable: true
          description: Nome do local de entrega; vazio quando nenhum local e informado
          example: "Campus UNITEC"
        userId:
          type: string
          format: uuid
        cartId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderWithItems:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required:
            - orderItems
          properties:
            orderItems:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"

    OrderItem:
      type: object
      required:
        - id
        - orderId
        - bookId
        - quantity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 2
        book:
          $ref: "#/components/schemas/OrderBook"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderBook:
      type: object
      required:
        - id
        - title
        - code
        - price
        - language
        - author
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        code:
          type: string
        price:
          type: number
          format: double
        language:
          type: string
        author:
          type: string

    OrderErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Carrinho nao encontrado"
