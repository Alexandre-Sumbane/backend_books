openapi: 3.0.0
info:
  title: Books API
  description: API para gerenciamento de livros
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

tags:
  - name: Books
    description: Operações relacionadas a livros

paths:
  /books:
    post:
      summary: Criar um novo livro
      description: Cria um novo livro no sistema. A data de publicação é automaticamente definida como a data atual.
      operationId: createBook
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - code
                - price
                - categoryId
                - authorId
                - format
              properties:
                title:
                  type: string
                  description: Título do livro
                  example: "Mapulango ++"
                  maxLength: 255
                code:
                  type: string
                  description: Código único do livro
                  example: "2223245"
                  unique: true
                description:
                  type: string
                  description: Descrição detalhada do livro
                  example: "Romance antigo"
                price:
                  type: number
                  format: float
                  description: Preço do livro
                  example: 5000
                  minimum: 0
                categoryId:
                  type: string
                  format: uuid
                  description: ID da categoria do livro
                  example: "dad635e0-97b6-4ead-9f62-ad14f692c150"
                authorId:
                  type: string
                  format: uuid
                  description: ID do autor do livro
                  example: "fd5f28da-2045-4579-be60-e7c0762cc2ca"
                format:
                  type: string
                  description: Formato do livro
                  enum: [pdf, epub, mobi, physical]
                  example: "pdf"
                pages:
                  type: integer
                  description: Número de páginas
                  example: 200
                  minimum: 1
                imageUrl:
                  type: string
                  format: uri
                  description: URL da capa do livro
                  example: "https://example.com/book-cover.jpg"
                isbn:
                  type: string
                  description: Código ISBN do livro
                  example: "978-3-16-148410-0"
                language:
                  type: string
                  description: Idioma do livro
                  example: "Português"
                  default: "Português"
                publisher:
                  type: string
                  description: Editora do livro
                  example: "Editora Exemplo"
                edition:
                  type: integer
                  description: Edição do livro
                  example: 1
            example:
              title: "Mapulango ++"
              code: "2223245"
              description: "Romance antigo"
              price: 5000
              categoryId: "dad635e0-97b6-4ead-9f62-ad14f692c150"
              authorId: "fd5f28da-2045-4579-be60-e7c0762cc2ca"
              format: "pdf"
              pages: 200
      responses:
        '201':
          description: Livro criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
              example:
                id: "123e4567-e89b-12d3-a456-426614174000"
                title: "Mapulango ++"
                code: "2223245"
                description: "Romance antigo"
                price: 5000
                format: "pdf"
                pages: 200
                publishDate: "2024-01-01T00:00:00.000Z"
                categoryId: "dad635e0-97b6-4ead-9f62-ad14f692c150"
                createdAt: "2024-01-01T00:00:00.000Z"
                updatedAt: "2024-01-01T00:00:00.000Z"
        '400':
          description: Dados inválidos fornecidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                message: "Invalid book data"
                error: "Bad Request"
        '409':
          description: Conflito - Código do livro já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Categoria ou Autor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar todos os livros
      description: Retorna uma lista com todos os livros cadastrados
      operationId: getAllBooks
      tags:
        - Books
      parameters:
        - name: limit
          in: query
          description: Número máximo de livros para retornar
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Número de livros para pular (paginação)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: category
          in: query
          description: Filtrar por ID da categoria
          schema:
            type: string
            format: uuid
        - name: author
          in: query
          description: Filtrar por ID do autor
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          description: Preço mínimo
          schema:
            type: number
            format: float
        - name: maxPrice
          in: query
          description: Preço máximo
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Lista de livros recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total de livros encontrados
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookSummary'
              example:
                total: 2
                books:
                  - id: "123e4567-e89b-12d3-a456-426614174000"
                    title: "Mapulango ++"
                    code: "2223245"
                    description: "Romance antigo"
                    price: 5000
                    format: "pdf"
                    pages: 200
                    publishDate: "2024-01-01T00:00:00.000Z"
                  - id: "987fcdeb-51a3-42d7-b893-123456789000"
                    title: "Aprendendo Node.js"
                    code: "9876543"
                    description: "Guia prático de Node.js"
                    price: 8900
                    format: "epub"
                    pages: 350
                    publishDate: "2024-01-02T00:00:00.000Z"
        '404':
          description: Nenhum livro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: "No Books found"
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/{id}:
    get:
      summary: Buscar livro por ID
      description: Retorna os detalhes completos de um livro específico incluindo sua categoria e autores
      operationId: getBookById
      tags:
        - Books
      parameters:
        - name: id
          in: path
          required: true
          description: ID do livro
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Livro encontrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetails'
              example:
                id: "123e4567-e89b-12d3-a456-426614174000"
                title: "Mapulango ++"
                code: "2223245"
                description: "Romance antigo"
                price: 5000
                format: "pdf"
                pages: 200
                publishDate: "2024-01-01T00:00:00.000Z"
                createdAt: "2024-01-01T00:00:00.000Z"
                updatedAt: "2024-01-01T00:00:00.000Z"
                category:
                  id: "dad635e0-97b6-4ead-9f62-ad14f692c150"
                  name: "Ficção"
                  description: "Livros de ficção"
                authors:
                  - id: "fd5f28da-2045-4579-be60-e7c0762cc2ca"
                    name: "João"
                    lastName: "Silva"
                    imageUrl: "https://example.com/author.jpg"
        '404':
          description: Livro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: "Book not found"
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      summary: Atualizar livro
      description: Atualiza os dados de um livro existente
      operationId: updateBook
      tags:
        - Books
      parameters:
        - name: id
          in: path
          required: true
          description: ID do livro a ser atualizado
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Título do livro
                  example: "Mapulango ++ (Edição Especial)"
                description:
                  type: string
                  description: Descrição do livro
                  example: "Romance antigo - Edição comemorativa"
                price:
                  type: number
                  format: float
                  description: Preço do livro
                  example: 5999
                format:
                  type: string
                  enum: [pdf, epub, mobi, physical]
                  description: Formato do livro
                  example: "epub"
                pages:
                  type: integer
                  description: Número de páginas
                  example: 210
                categoryId:
                  type: string
                  format: uuid
                  description: ID da categoria
                  example: "dad635e0-97b6-4ead-9f62-ad14f692c150"
                imageUrl:
                  type: string
                  format: uri
                  description: URL da capa
                  example: "https://example.com/new-cover.jpg"
                language:
                  type: string
                  description: Idioma do livro
                  example: "Inglês"
                publisher:
                  type: string
                  description: Editora
                  example: "Editora Nova"
            example:
              title: "Mapulango ++ (Edição Especial)"
              price: 5999
              format: "epub"
              pages: 210
              description: "Romance antigo - Edição comemorativa"
      responses:
        '204':
          description: Livro atualizado com sucesso (sem conteúdo retornado)
        '400':
          description: Dados inválidos fornecidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Livro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: "Book not found"
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Deletar livro
      description: Remove um livro do sistema
      operationId: deleteBook
      tags:
        - Books
      parameters:
        - name: id
          in: path
          required: true
          description: ID do livro a ser deletado
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '204':
          description: Livro deletado com sucesso (sem conteúdo retornado)
        '404':
          description: Livro não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 404
                message: "Book not found"
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    BookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único do livro
        title:
          type: string
          description: Título do livro
        code:
          type: string
          description: Código único do livro
        description:
          type: string
          nullable: true
          description: Descrição do livro
        price:
          type: number
          format: float
          description: Preço do livro
        format:
          type: string
          enum: [pdf, epub, mobi, physical]
          description: Formato do livro
        pages:
          type: integer
          nullable: true
          description: Número de páginas
        publishDate:
          type: string
          format: date-time
          description: Data de publicação
        categoryId:
          type: string
          format: uuid
          description: ID da categoria
        createdAt:
          type: string
          format: date-time
          description: Data de criação do registro
        updatedAt:
          type: string
          format: date-time
          description: Data da última atualização

    BookSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        format:
          type: string
        pages:
          type: integer
          nullable: true
        publishDate:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true

    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lastName:
          type: string
        imageUrl:
          type: string
          nullable: true

    BookDetails:
      allOf:
        - $ref: '#/components/schemas/BookResponse'
        - type: object
          properties:
            category:
              $ref: '#/components/schemas/Category'
              nullable: true
            authors:
              type: array
              description: Lista de autores do livro
              items:
                $ref: '#/components/schemas/Author'

    BookInput:
      type: object
      required:
        - title
        - code
        - price
        - categoryId
        - authorId
        - format
      properties:
        title:
          type: string
          maxLength: 255
        code:
          type: string
          unique: true
        description:
          type: string
        price:
          type: number
          minimum: 0
        categoryId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        format:
          type: string
          enum: [pdf, epub, mobi, physical]
        pages:
          type: integer
          minimum: 1
        imageUrl:
          type: string
          format: uri
        isbn:
          type: string
          pattern: '^(?:ISBN(?:-13)?:? )?(?=[0-9]{13}$|(?=(?:[0-9]+[-\ ]){4})[-\ 0-9]{17}$)97[89][-\ ]?[0-9]{1,5}[-\ ]?[0-9]+[-\ ]?[0-9]+[-\ ]?[0-9]$'
        language:
          type: string
        publisher:
          type: string
        edition:
          type: integer

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: Código de status HTTP
          example: 404
        message:
          type: string
          description: Mensagem de erro
          example: "Resource not found"
        error:
          type: string
          description: Tipo do erro
          example: "Not Found"
      required:
        - statusCode
        - message